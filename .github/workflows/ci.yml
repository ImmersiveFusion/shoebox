name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Shoebox.sln

      - name: Build
        run: dotnet build src/Shoebox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Shoebox.sln --configuration Release --no-build --verbosity normal

  spa:
    name: SPA build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Shoebox.Spa
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Shoebox.Spa/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
