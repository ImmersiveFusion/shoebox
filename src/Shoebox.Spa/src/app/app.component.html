<div class="chrome" role="banner">
  <div class="brand">
    <!-- An open box with a small system inside and one severed link. Same idea as
         the repo banner: a snowglobe is sealed, a shoebox you can open up. -->
    <svg class="mark" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="sbTeal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5df2e2"/>
          <stop offset="100%" stop-color="#1c9c92"/>
        </linearGradient>
        <filter id="sbGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- the open box, lid off, near wall cut low -->
      <g stroke="url(#sbTeal)" fill="none" stroke-width="3" stroke-linejoin="round">
        <path d="M12 40 L50 22 L88 40 L50 58 Z" opacity="0.45"/>
        <path d="M12 40 L12 68 L50 86 L88 68 L88 40"/>
        <path d="M50 58 L50 86" opacity="0.55"/>
      </g>

      <!-- the small system inside -->
      <g filter="url(#sbGlow)">
        <circle cx="34" cy="52" r="3.4" fill="#5df2e2"/>
        <circle cx="52" cy="45" r="3.4" fill="#5df2e2"/>
        <circle cx="66" cy="55" r="3.4" fill="#5df2e2"/>
        <path d="M34 52 L52 45" stroke="#5df2e2" stroke-width="2" opacity="0.8"/>
        <!-- the severed one, and it is the only magenta in the mark -->
        <path d="M52 45 L60 50" stroke="#ff2d6f" stroke-width="2"/>
        <path d="M63 53 L66 55" stroke="#ff2d6f" stroke-width="2"/>
        <circle cx="61.5" cy="51.5" r="1.6" fill="#ff2d6f"/>
      </g>
    </svg>

    <span class="wordmark">
      <strong>Shoebox</strong>
      <em>a small system you can break</em>
    </span>
  </div>

  <div class="spacer"></div>

  <a class="repo" href="https://github.com/ImmersiveFusion/shoebox"
     target="_blank" rel="noopener" title="Shoebox on GitHub" aria-label="Shoebox on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>

  <a class="sibling" href="https://github.com/ImmersiveFusion/snowglobe" target="_blank" rel="noopener">
    Sibling: Snowglobe
  </a>
</div>

<main role="main">
  <app-shoebox></app-shoebox>
</main>
